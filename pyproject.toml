[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-pldl"
version = "0.1.0"
description = "Download a YouTube playlist as high-resolution WAVs, with optional lossless SoundCloud upgrades."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nigushto" }]
keywords = [
    "youtube",
    "soundcloud",
    "yt-dlp",
    "ffmpeg",
    "wav",
    "playlist",
    "music",
    "downloader",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "yt-dlp>=2024.1.1",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/nigushto/yt-pldl"
Repository = "https://github.com/nigushto/yt-pldl"
Issues = "https://github.com/nigushto/yt-pldl/issues"

[project.scripts]
ytpldl = "ytpldl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ytpldl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
